<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZoneZet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>
  <!-- GLOBAL PRELOADER -->
  <div id="global-preloader">
    <img src="img/logo.png" alt="ZoneZet Logo" class="preloader-logo">
  </div>

    <div class="dashboard">
        <!-- แถบด้านข้าง (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img class="logo-circle" src="img/logo.png" alt="ZoneZet Logo">
                <img class="logo-text" src="img/ZoneZet.png" alt="ZoneZet">
            </div>
            <nav class="sidebar-nav">
                <div class="floating-active"></div>
                <a class="nav-item" href="index.html">
                    <img class="nav-icon" src="img/Home_Page.png" alt="">
                    <span>HOME</span>
                </a>
                <a class="nav-item" href="gdp.html">
                    <img class="nav-icon" src="img/Combo_Chart.png" alt="">
                    <span>GDP</span>
                </a>
                <a class="nav-item" href="inflation.html">
                    <img class="nav-icon" src="img/Profit.png" alt="">
                    <span>INFLATION</span>
                </a>
                <a class="nav-item" href="unemployment.html">
                    <img class="nav-icon" src="img/Sugar_Free.png" alt="">
                    <span>UNEMPLOYMENT</span>
                </a>
                <div class="nav-spacer"></div>
                <a class="nav-item active" href="record.html">
                    <img class="nav-icon" src="img/General_Ledger.png" alt="">
                    <span>RECORD</span>
                </a>
            </nav>
        </aside>

        <!-- เนื้อหาหลัก -->
        <main class="main-content">
            <div class="record-layout">
                <div class="record-card">
                    <div class="record-header">
                        <div class="record-icon"></div>
                    </div>
                </div>
                <div class="record-card">
                    <div class="record-header">
                        <div class="record-icon"></div>
                    </div>
                </div>
                <div class="record-card">
                    <div class="record-header">
                        <div class="record-icon"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- JavaScript Modules แยกตามหน้าที่อย่างชัดเจน -->
    <script src="js/uiComponents.js"></script>
    <script src="js/indicatorTable.js"></script>
    <script src="js/comparisonModal.js"></script>
    <script src="js/recordManager.js"></script>
    <script src="js/navigationRouter.js"></script>
</body>
</html>
