<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZoneZet Economic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">

        <!-- แถบด้านข้าง (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <!-- 🔧 แก้ src เป็นรูปโลโก้ของคุณ เช่น src="img/logo.png" -->
                <img class="logo-circle" src="img/logo.png" alt="ZoneZet Logo">
                <!-- 🔧 แก้ src เป็นรูปชื่อโลโก้ของคุณ -->
                <img class="logo-text" src="img/ZoneZet.png" alt="ZoneZet">
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" type="button">
                    <!-- 🔧 แก้ src เป็นไอคอนของคุณ -->
                    <img class="nav-icon" src="img/Home_Page.png" alt="">
                    <span>HOME</span>
                </button>
                <button class="nav-item" type="button">
                    <img class="nav-icon" src="img/Combo_Chart.png" alt="">
                    <span>GDP</span>
                </button>
                <button class="nav-item" type="button">
                    <img class="nav-icon" src="img/Profit.png" alt="">
                    <span>INFLATION</span>
                </button>
                <button class="nav-item" type="button">
                    <img class="nav-icon" src="img/Sugar_Free.png" alt="">
                    <span>UNEMPLOYMENT</span>
                </button>
                <div class="nav-spacer"></div>
                <button class="nav-item" type="button">
                    <img class="nav-icon" src="img/General_Ledger.png" alt="">
                    <span>RECORD</span>
                </button>
            </nav>
        </aside>

        <!-- เนื้อหาหลัก -->
        <main class="main-content">

            <!-- Carousel -->
            <section class="carousel">
                <button class="carousel-arrow" type="button">
                    <img src="img/Arorow_l.png" alt="Previous">
                </button>
                <div class="carousel-content"></div>
                <button class="carousel-arrow" type="button">
                    <img src="img/Arorow_r.png" alt="Next">
                </button>
            </section>

            <!-- การ์ด 3 ใบ -->
            <section class="cards">
                <div class="card" id="card-gdp">
                    <h2 class="card-title">GDP TOP 5</h2>
                    <div class="card-row"><span class="country">Amarica</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">China</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Thai</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Mexico</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Jpan</span><span class="value green">15%</span></div>
                </div>
                <div class="card" id="card-inflation">
                    <h2 class="card-title">INFLATION TOP 5</h2>
                    <div class="card-row"><span class="country">Amarica</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">China</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Thai</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Mexico</span><span class="value green">15%</span></div>
                    <div class="card-row"><span class="country">Jpan</span><span class="value green">15%</span></div>
                </div>
                <div class="card" id="card-unemployment">
                    <h2 class="card-title">UNEMPLOYMENT TOP 5</h2>
                    <div class="card-row"><span class="country">Amarica</span><span class="value red">15%</span></div>
                    <div class="card-row"><span class="country">China</span><span class="value red">15%</span></div>
                    <div class="card-row"><span class="country">Thai</span><span class="value red">15%</span></div>
                    <div class="card-row"><span class="country">Mexico</span><span class="value red">15%</span></div>
                    <div class="card-row"><span class="country">Jpan</span><span class="value red">15%</span></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
