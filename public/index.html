<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZoneZet Economic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">

        <!-- แถบด้านข้าง (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <!-- 🔧 แก้ src เป็นรูปโลโก้ของคุณ เช่น src="img/logo.png" -->
                <img class="logo-circle" src="img/logo.png" alt="ZoneZet Logo">
                <!-- 🔧 แก้ src เป็นรูปชื่อโลโก้ของคุณ -->
                <img class="logo-text" src="img/ZoneZet.png" alt="ZoneZet">
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" href="index.html">
                    <img class="nav-icon" src="img/Home_Page.png" alt="">
                    <span>HOME</span>
                </a>
                <a class="nav-item" href="gdp.html">
                    <img class="nav-icon" src="img/Combo_Chart.png" alt="">
                    <span>GDP</span>
                </a>
                <a class="nav-item" href="inflation.html">
                    <img class="nav-icon" src="img/Profit.png" alt="">
                    <span>INFLATION</span>
                </a>
                <a class="nav-item" href="unemployment.html">
                    <img class="nav-icon" src="img/Sugar_Free.png" alt="">
                    <span>UNEMPLOYMENT</span>
                </a>
                <div class="nav-spacer"></div>
                <a class="nav-item" href="record.html">
                    <img class="nav-icon" src="img/General_Ledger.png" alt="">
                    <span>RECORD</span>
                </a>
            </nav>
        </aside>

        <!-- เนื้อหาหลัก -->
        <main class="main-content">

            <!-- Carousel -->
            <section class="carousel">
                <button class="carousel-arrow" id="prevBtn" type="button">
                    <img src="img/Arorow_l.png" alt="Previous">
                </button>
                <div class="carousel-viewport">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- 🔧 เปลี่ยน src เป็นภาพของคุณ -->
                        <div class="carousel-slide"><img src="img/GDP_preview.jpg" alt="Slide 1"></div>
                        <div class="carousel-slide"><img src="img/Inflation.png" alt="Slide 2"></div>
                        <div class="carousel-slide"><img src="img/Wellcome.jpg" alt="Slide 3"></div>
                    </div>
                </div>
                <button class="carousel-arrow" id="nextBtn" type="button">
                    <img src="img/Arorow_r.png" alt="Next">
                </button>
            </section>

            <!-- การ์ด 3 ใบ -->
            <section class="cards">
                <div class="card" id="card-gdp">
                    <h2 class="card-title">GDP TOP 5 (2025)</h2>
                    <div class="card-row"><span class="country">กำลังโหลด...</span><span class="value green">...</span></div>
                </div>
                <div class="card" id="card-inflation">
                    <h2 class="card-title">INFLATION TOP 5 (2025)</h2>
                    <div class="card-row"><span class="country">กำลังโหลด...</span><span class="value red">...</span></div>
                </div>
                <div class="card" id="card-unemployment">
                    <h2 class="card-title">UNEMPLOYMENT TOP 5 (2025)</h2>
                    <div class="card-row"><span class="country">กำลังโหลด...</span><span class="value red">...</span></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
