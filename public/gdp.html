<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZoneZet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>
  <!-- GLOBAL PRELOADER -->
  <div id="global-preloader">
    <img src="img/logo.png" alt="ZoneZet Logo" class="preloader-logo">
  </div>

    <div class="dashboard">
        <!-- แถบด้านข้าง (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img class="logo-circle" src="img/logo.png" alt="ZoneZet Logo">
                <img class="logo-text" src="img/ZoneZet.png" alt="ZoneZet">
            </div>
            <nav class="sidebar-nav">
                <div class="floating-active"></div>
                <a class="nav-item" href="index.html">
                    <img class="nav-icon" src="img/Home_Page.png" alt="">
                    <span>HOME</span>
                </a>
                <a class="nav-item active" href="gdp.html">
                    <img class="nav-icon" src="img/Combo_Chart.png" alt="">
                    <span>GDP</span>
                </a>
                <a class="nav-item" href="inflation.html">
                    <img class="nav-icon" src="img/Profit.png" alt="">
                    <span>INFLATION</span>
                </a>
                <a class="nav-item" href="unemployment.html">
                    <img class="nav-icon" src="img/Sugar_Free.png" alt="">
                    <span>UNEMPLOYMENT</span>
                </a>
                <div class="nav-spacer"></div>
                <a class="nav-item" href="record.html">
                    <img class="nav-icon" src="img/General_Ledger.png" alt="">
                    <span>RECORD</span>
                </a>
            </nav>
        </aside>

        <!-- เนื้อหาหลัก -->
        <main class="main-content">
            <div class="data-layout">
                <div class="main-panel">
                    <div class="search-bar">
                                                                        <div class="custom-select-wrapper">
                            <div class="custom-select-trigger">
                                <span class="custom-select-text">2025</span>
                                <div class="custom-select-arrow"></div>
                            </div>
                            <div class="custom-options">
                                <div class="custom-option selected" data-value="2025">2025</div>
                                <div class="custom-option" data-value="2024">2024</div>
                                <div class="custom-option" data-value="2023">2023</div>
                                <div class="custom-option" data-value="2022">2022</div>
                                <div class="custom-option" data-value="2021">2021</div>
                                <div class="custom-option" data-value="2020">2020</div>
                            </div>
                            <input type="hidden" class="search-select" value="2025">
                        </div>
                        <input class="search-input" type="text" placeholder="search for a country...">
                        <button type="button" class="search-btn">
                            <img class="search-icon" src="img/search.png" alt="Search">
                        </button>
                    </div>
                    <div class="data-header">
                        <div class="col-no">NO.</div>
                        <div class="col-country">COUNTRY</div>
                          <div class="col-region">REGION</div>
                        <div class="col-value">GDP GROWTH</div>
                        <div class="col-action">COMPARE</div>
                    </div>
                    <div class="data-table">
                        <div class="data-row">
                            <div class="col-country" style="opacity: 0.6;">กำลังโหลดข้อมูล...</div>
                        </div>
                    </div>
                </div>
                <div class="comparison-panel">
                    <div class="comp-title">COMPARISON AREA</div>
                    <div class="comp-list">
                        <!-- รายการที่ถูก ADD จะแสดงที่นี่ -->
                    </div>
                                        <button class="btn-compare">
                        <svg class="btn-compare-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                            <polyline points="2 12 6 8 12 14 22 4"></polyline>
                        </svg>
                        GDP
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script src="indicator.js"></script>
</body>
</html>
